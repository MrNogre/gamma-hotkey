name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check tag matches Version
        run: |
          version=$(dotnet msbuild GammaHotkey/GammaHotkey.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Version $version"
            exit 1
          fi

      - run: dotnet publish GammaHotkey/GammaHotkey.csproj -c Release -p:PublishProfile=win-x64

      - name: Package
        run: |
          mkdir dist
          cp GammaHotkey/bin/publish/win-x64/GammaHotkey.exe dist/
          cd dist
          7z a -tzip "gamma-hotkey-$GITHUB_REF_NAME-win-x64.zip" GammaHotkey.exe
          sha256sum *.zip GammaHotkey.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/GammaHotkey.exe

      # Notes from the matching CHANGELOG.md section, else generated by GitHub.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="[${GITHUB_REF_NAME#v}]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md 2>/dev/null || true)
          if [ -n "$notes" ]; then args=(--notes "$notes"); else args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${args[@]}" dist/*.zip dist/SHA256SUMS.txt
